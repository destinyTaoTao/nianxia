[package]
name = "nianxia-age-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nx-age"
path = "src/main.rs"

[dependencies]
age = { version = "=0.12.1", default-features = false }
zeroize = "=1.8.2"
libc = "=0.2.186"

[profile.release]
panic = "unwind"
strip = "symbols"
